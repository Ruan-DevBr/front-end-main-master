<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: aqua;
            font-family: sans-serif;
            align-items: center;
        }

        h1 {
            display: flex;
            justify-content: center;
        }

        p {
            display: flex;
            align-content: center;
            justify-content: center;
        }

        input {
            border-radius: 10px;
            align-content: space-between;
        }

        ::placeholder {
            padding-left: 5px;
        }

    </style>
</head>
<body>
    <h1>Cadastro do Estudante</h1>

<form action="">
    <p>
    <label for="name">Nome:</label>
    <input type="Nome" id="name" name="name" placeholder="Ruan">
    </p>

    <p>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="exemplo@gmail.com">
    </p>

    <p>
    <label for="password">Senha:</label>
    <input type="password" id="password" name="password" placeholder="123456">
    </p>
    <button>Enviar</button>
    <button>Limpar</button>
</form>
</body>
</html>
